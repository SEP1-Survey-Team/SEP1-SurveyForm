<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FILMBOX - Create your account</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <!-- HEADER -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">FB</div>
          <div class="logo-text">
            <strong>FILMBOX</strong>
            <span>CREATE YOUR ACCOUNT</span>
          </div>
        </div>

        <nav class="navigation">
          <a href="#" class="login">Log in</a>
          <a href="#" class="help">Help</a>
        </nav>
      </header>

      <!-- MAIN -->
      <main class="main">
        <form class="form-card">
          <h1>Create your account</h1>

          <!-- NAME -->
          <div class="name-row">
            <div class="form-group">
              <label for="first-name">First name</label>
              <input type="text" id="first-name" placeholder="Jane" required />
            </div>

            <div class="form-group">
              <label for="last-name">Last name</label>
              <input type="text" id="last-name" placeholder="Doe" required />
            </div>
          </div>

          <!-- EMAIL -->
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="jane@example.com"
              required
            />
          </div>

          <!-- USERNAME -->
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="jane_doe" required />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••••"
              required
            />
          </div>

          <!-- GENDER -->
          <div class="form-group">
            <label>Gender</label>

            <div class="gender-options">
              <label class="gender-option">
                Male
                <input type="radio" name="gender" value="male" checked />
              </label>

              <label class="gender-option">
                Female
                <input type="radio" name="gender" value="female" />
              </label>

              <label class="gender-option">
                Other
                <input type="radio" name="gender" value="other" />
              </label>
            </div>
          </div>

          <!-- BIRTHDATE -->
          <div class="form-group">
            <label for="birthdate">Birthdate</label>
            <input
              type="date"
              id="birthdate"
              placeholder="DD/MM/YYYY"
            />
          </div>

          <!-- FAVORITE DECADE -->
          <div class="form-group">
            <label for="decade">Favorite decade</label>

            <select id="decade" name="decade">
              <option value="1980" selected>1980</option>
              <option value="1960">1960</option>
              <option value="1970">1970</option>
              <option value="1990">1990</option>
              <option value="2000">2000</option>
              <option value="2010">2010</option>
              <option value="2020">2020</option>
            </select>
          </div>

          <!-- ABOUT YOU -->
          <div class="form-group">
            <label for="about">About you</label>
            <textarea
              id="about"
              rows="4"
              placeholder="Tell us what you love about movies."
            ></textarea>
          </div>

          <!-- FAVORITE GENRES -->
          <div class="form-group">
            <label>Favorite genres</label>

            <div class="genres">
              <label>
                <input type="checkbox" unchecked />
                Action
              </label>

              <label>
                <input type="checkbox" unchecked />
                Sci-Fi
              </label>

              <label>
                <input type="checkbox" unchecked />
                Drama
              </label>

              <label>
                <input type="checkbox" unchecked />
                Comedy
              </label>

              <label>
                <input type="checkbox" unchecked />
                Horror
              </label>

              <label>
                <input type="checkbox" unchecked />
                Documentary
              </label>
            </div>
          </div>

          <!-- BUTTON -->
          <button type="submit" class="submit-btn">Create account</button>
        </form>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <div class="footer-left">
          <strong>FILMBOX</strong>
          <p>Discover, discuss, and share the films you love.</p>
        </div>

        <div class="footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Support</a>
        </div>
      </footer>
    </div>
  </body>
</html>
